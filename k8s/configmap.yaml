apiVersion: v1
kind: ConfigMap
metadata:
  name: email-auth-gateway-config
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  MAX_MESSAGE_SIZE_BYTES: "26214400"
  MAX_URLS_ANALYZED_PER_MESSAGE: "25"
  MAX_ATTACHMENTS_ANALYZED_PER_MESSAGE: "10"
  MAX_ATTACHMENT_SIZE_BYTES: "41943040"
  EXTERNAL_CALL_TIMEOUT_SECONDS: "8.0"
  RATE_LIMIT_MAX_REQUESTS: "120"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  DOMAIN_AGE_CACHE_TTL_SECONDS: "21600"
  REPUTATION_CACHE_TTL_SECONDS: "1800"
  DEDUP_TTL_SECONDS: "86400"
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: "5"
  CIRCUIT_BREAKER_RESET_TIMEOUT_SECONDS: "30.0"
  USE_REDIS: "true"
  REDIS_URL: "redis://gateway-redis:6379/0"
  RAW_MAIL_LOG_DIR: "/app/quarantine/raw"
  AUDIT_LOG_PATH: "/app/logs/audit.jsonl"
  ADMIN_AUDIT_LOG_PATH: "/app/logs/admin-audit.jsonl"
  QUARANTINE_DIR: "/app/quarantine/store"
  RELAY_HOST: "smtp-relay.internal"
  RELAY_PORT: "587"
  RELAY_USE_TLS: "false"
  RELAY_START_TLS: "true"
  ENABLE_TAG_ONLY_MODE: "false"
  CLAMD_HOST: "gateway-clamav"
  CLAMD_PORT: "3310"
  WARN_THRESHOLD: "30"
  QUARANTINE_THRESHOLD: "70"
