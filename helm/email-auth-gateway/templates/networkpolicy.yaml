{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "email-auth-gateway.fullname" . }}
  labels:
    {{- include "email-auth-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "email-auth-gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingress.from }}
        {{- toYaml .Values.networkPolicy.ingress.from | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # Allow DNS resolution
    {{- if .Values.networkPolicy.egress.allowDns }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    # Allow Redis communication
    {{- if .Values.networkPolicy.egress.allowRedis }}
    - ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    # Allow ClamAV daemon
    {{- if .Values.networkPolicy.egress.allowClamav }}
    - ports:
        - protocol: TCP
          port: 3310
    {{- end }}
    # Allow Outbound SMTP Relays
    {{- if .Values.networkPolicy.egress.allowSmtpRelay }}
    - ports:
        - protocol: TCP
          port: 25
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 465
    {{- end }}
    # Allow HTTPS external APIs (VirusTotal, Google Safe Browsing, RDAP, Webhooks)
    {{- if .Values.networkPolicy.egress.allowHttpsApis }}
    - ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
