# Staging environment overrides
replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/proxy-body-size: "35m"
  hosts:
    - host: gateway.staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: email-auth-gateway-staging-tls
      hosts:
        - gateway.staging.example.com

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 256Mi

config:
  appEnv: "staging"
  logLevel: "INFO"
  useRedis: true
  redisUrl: "redis://staging-redis.internal:6379/0"
  relayHost: "staging-smtp.internal.example.com"
  relayPort: 587
  enableTagOnlyMode: true  # Safe evaluation mode for staging
  clamdHost: "staging-clamav.internal"

persistence:
  quarantine:
    enabled: true
    size: 20Gi
  logs:
    enabled: true
    size: 10Gi
