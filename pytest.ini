[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    live: Live integration tests querying real external services / DNS (gated by --run-live)
    performance: Load and performance benchmark tests with strict SLA assertions
    chaos: Chaos engineering and fault-injection resilience tests
    security_regression: Security bypass regression tests for evasions and exploits
    contract: Webhook provider schema contract and mutation tests
